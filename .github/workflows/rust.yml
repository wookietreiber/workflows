---

name: rust

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: true

jobs:

  check:
    name: cargo fmt --check and clippy
    runs-on: ubuntu-latest

    steps:

      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: clippy, rustfmt
          rustflags: ''

      - name: check formatting
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy

  msrv:
    name: msrv
    runs-on: ubuntu-latest

    outputs:
      msrv: ${{ steps.msrv.outputs.msrv }}

    steps:

      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: install cargo-msrv
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2.81.3
        with:
          tool: cargo-msrv@0.19.3

      - name: show cargo-msrv version
        run: cargo msrv --version

      - name: get msrv
        run: |
          msrv=$(cargo msrv show --output-format minimal)
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
        id: msrv

      - name: show msrv
        run: echo ${{ steps.msrv.outputs.msrv }}

  test:
    name: cargo check, build and test
    runs-on: ubuntu-latest
    needs: msrv

    strategy:
      matrix:
        toolchain:
          - null # this will use rust-toolchain.toml
          - ${{ needs.msrv.outputs.msrv }}

    steps:

      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: cargo check
        run: cargo check

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test

...
