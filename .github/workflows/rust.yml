---

name: rust

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: true

jobs:

  check:
    name: cargo fmt --check and clippy
    runs-on: ubuntu-latest

    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy, rustfmt
          rustflags: ''

      - name: check formatting
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy

  msrv:
    name: msrv
    runs-on: ubuntu-latest

    outputs:
      msrv: ${{ steps.msrv.outputs.msrv }}

    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install cargo-msrv
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-msrv@0.19.3

      - name: show cargo-msrv version
        run: cargo msrv --version

      - name: get msrv
        run: |
          msrv=$(cargo msrv show --output-format minimal)
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
        id: msrv

      - name: show msrv
        run: echo ${{ steps.msrv.outputs.msrv }}

  test:
    name: cargo check, build and test
    runs-on: ubuntu-latest
    needs: msrv

    strategy:
      matrix:
        toolchain:
          - null # this will use rust-toolchain.toml
          - ${{ needs.msrv.outputs.msrv }}

    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: cargo check
        run: cargo check

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test

...
