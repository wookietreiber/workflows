---

name: actionlint

on:
  pull_request:
    paths:
      - .github/workflows/*.yml
  push:
    paths:
      - .github/workflows/*.yml
  workflow_call:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        uses: docker://rhysd/actionlint:1.7.11
        with:
          args: -color -verbose

...
