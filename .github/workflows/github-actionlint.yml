---

name: actionlint

on:
  pull_request:
    paths:
      - .github/workflows/*.yml
  push:
    paths:
      - .github/workflows/*.yml
  workflow_call:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      -
        uses: docker://rhysd/actionlint:1.7.11
        with:
          args: -color -verbose

...
