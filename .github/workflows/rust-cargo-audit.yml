---

name: rust cargo-audit

on:
  workflow_call:
    secrets:
      token:
        required: true

permissions: {}

jobs:

  cargo-audit:
    name: cargo-audit

    runs-on: ubuntu-latest

    permissions:
      checks: write # PR status checks
      issues: write # create issues from schedule

    steps:

      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.23.0

      - name: generate Cargo.lock if missing
        if: ${{ hashFiles('Cargo.lock') == '' }}
        run: cargo generate-lockfile

      -
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.token }}

...
